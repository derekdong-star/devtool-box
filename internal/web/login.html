<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbox 登录</title>
<link rel="icon" type="image/svg+xml" href="/static/img/toolbox-favicon.svg">
<link rel="stylesheet" href="/static/css/main.css">
<style>
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at top, rgba(var(--violet-rgb), 0.16), transparent 36%),
    linear-gradient(145deg, #eef2ff 0%, var(--surface-alt) 42%, var(--bg) 100%);
}
.login-card {
  width: min(440px, calc(100vw - 32px));
  background: rgba(255, 255, 255, 0.9);
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  border-radius: 24px;
  box-shadow: 0 24px 80px rgba(79, 70, 229, 0.16), 0 10px 24px rgba(26, 29, 46, 0.08);
  padding: 30px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  backdrop-filter: blur(14px);
}
.login-brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.login-mark {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  box-shadow: 0 16px 36px rgba(79, 70, 229, 0.18);
  flex-shrink: 0;
}
.login-brand-copy {
  display: flex;
  flex-direction: column;
}
.login-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--violet);
}
.login-title { font-size: 24px; font-weight: 800; color: var(--text); letter-spacing: -0.04em; }
.login-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: -6px; }
.login-field { display: flex; flex-direction: column; gap: 7px; }
.login-field label { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
.login-error { display: none; color: var(--danger); font-size: 12px; background: var(--danger-light); border-radius: var(--radius); padding: 8px 10px; }
</style>
</head>
<body>
  <form class="login-card" onsubmit="login(event)">
    <div class="login-brand">
      <img src="/static/img/toolbox-mark.svg" alt="Toolbox" class="login-mark">
      <div class="login-brand-copy">
        <div class="login-kicker">Backend Utilities</div>
        <div class="login-title">Toolbox</div>
      </div>
    </div>
    <div class="login-subtitle">远程访问需要登录认证</div>

    <div class="login-field">
      <label for="user">用户名</label>
      <input id="user" autocomplete="username" autofocus placeholder="admin">
    </div>
    <div class="login-field">
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="输入密码">
    </div>
    <div id="loginError" class="login-error"></div>
    <button class="btn btn-primary" type="submit" style="height:38px">登录</button>
  </form>

<script>
async function login(e) {
  e.preventDefault();
  const error = document.getElementById('loginError');
  error.style.display = 'none';
  const user = document.getElementById('user').value.trim();
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user, password })
  }).then(r => r.json()).catch(() => ({ code: -1, msg: '网络错误' }));
  if (res.code === 0) {
    location.href = '/';
    return;
  }
  error.textContent = res.msg || '登录失败';
  error.style.display = 'block';
}
</script>
</body>
</html>
